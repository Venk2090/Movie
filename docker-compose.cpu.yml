version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/storage/studio.db
      - HARDWARE_MODE=cpu
      - STORAGE_DIR=/app/storage
      - MOCK_PIPELINE=true
    volumes:
      - ./storage:/app/storage
      - ./configs:/app/configs
